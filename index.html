<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *;" />
  <title>TarotPro</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="compact.css" />
  <link rel="stylesheet" href="toast.css" />
</head>
<body>
  <div id="titlebar">
    <span id="app-title">TarotPro</span>
    <button id="btn-quit" title="關閉">✕</button>
  </div>

  <div id="toolbar">
    <button id="btn-omen">抽牌</button>
    <button id="btn-pick">選牌</button>
    <button id="btn-shuffle">洗牌</button>
    <button id="btn-interpret">解牌</button>
    <button id="btn-save">保存</button>
    <button id="btn-by-card">逐張解釋</button>
  </div>

  <input id="question-input" type="text" placeholder="輸入占卜問題（可留空）" />

  <div id="tree-canvas">
    <div id="tree-content">
      <svg id="tree-lines"></svg>
      <div id="card-tip" hidden></div>
    </div>
  </div>

  <div id="status"></div>

  <div id="card-explanations" hidden></div>
  <div id="interpret-result" hidden></div>

  <div id="picker-overlay" hidden>
    <div id="picker-box">
      <div id="picker-head">
        <span>選擇卡牌加入第一層</span>
        <button id="picker-close" title="關閉">✕</button>
      </div>
      <div class="picker-hint">左鍵：正位　右鍵：逆位</div>
      <div id="picker-grid"></div>
    </div>
  </div>

  <script src="toast.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

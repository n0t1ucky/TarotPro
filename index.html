<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *;" />
  <title>TarotPro</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="compact.css" />
  <link rel="stylesheet" href="toast.css" />
</head>
<body>
  <div id="titlebar">
    <span id="app-title">TarotPro</span>
    <button id="btn-quit" title="關閉">✕</button>
  </div>

  <div id="omen-area">
    <button id="btn-omen">抽牌</button>
  </div>

  <input id="question-input" type="text" placeholder="輸入占卜問題（可留空）" />

  <div id="action-row">
    <button id="btn-interpret">解牌</button>
  </div>

  <div id="status"></div>

  <div id="interpret-result" hidden></div>

  <script src="toast.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

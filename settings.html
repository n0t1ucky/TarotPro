<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *;" />
  <title>設置</title>
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="toast.css" />
</head>
<body>
  <h1>設置</h1>

  <div class="field">
    <label for="api-token">API Token</label>
    <input id="api-token" type="password" placeholder="輸入 API token" />
  </div>

  <div class="field">
    <label for="api-base-url">BASE URL (OpenAI 格式)</label>
    <div class="row">
      <input id="api-base-url" type="text" placeholder="https://api.example.com/v1" />
      <button id="btn-connect">連接</button>
    </div>
  </div>

  <div class="field" id="model-field" style="display:none;">
    <label for="model-select">選擇模型</label>
    <select id="model-select"></select>
  </div>

  <hr />

  <div class="field">
    <label for="win-size-select">主視窗尺寸</label>
    <select id="win-size-select"></select>
  </div>

  <div class="field">
    <label for="root-limit">第一層卡牌上限</label>
    <input id="root-limit" type="number" min="1" max="78" value="6" />
  </div>

  <div class="field">
    <label for="theme-select">主題</label>
    <div class="row">
      <select id="theme-select">
        <option value="minimal">極簡</option>
        <option value="classic">經典</option>
      </select>
      <button id="btn-theme-apply">刷新並套用</button>
    </div>
  </div>

  <hr />

  <div class="field">
    <label>塔羅解牌</label>
    <button id="btn-interpret">解讀今日抽牌</button>
  </div>

  <div id="result" class="result" hidden></div>

  <hr />

  <div class="field">
    <label>今日抽牌</label>
    <div id="today-cards" class="result info">尚未抽牌</div>
  </div>

  <div class="field">
    <label>今日解讀</label>
    <div id="today-interpret" class="result info">尚無解讀</div>
  </div>

  <div class="field">
    <button id="btn-history">顯示歷史記錄</button>
  </div>

  <div id="history-list" class="result" hidden></div>

  <div class="field">
    <button id="btn-log">解牌日誌</button>
  </div>

  <div id="log-list" class="result" hidden></div>

  <div id="msg"></div>

  <script src="toast.js"></script>
  <script src="settings.js"></script>
</body>
</html>
